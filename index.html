<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#02030a" />
  <meta name="description" content="Univers des IA : ChatGPT, Gemini, Claude, Grok, Qwen, Kimi et GLM en orbite dans un espace 3D interactif." />
  <title>Univers des IA</title>
  <style>
    :root {
      --bg: #02030a;
      --text: #eef2ff;
      --muted: #8b93ad;
      --glass: rgba(14, 18, 32, 0.58);
      --line: rgba(255, 255, 255, 0.12);
      --c: #7aa2ff;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }

    /* ----- Écran de chargement ----- */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 22px;
      background: radial-gradient(circle at 50% 45%, #0b1226, var(--bg) 70%);
      transition: opacity 1s var(--ease), visibility 1s;
    }
    #loader.hide { opacity: 0; visibility: hidden; }
    .spinner {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-top-color: #9db8ff;
      border-right-color: #c4a8ff;
      animation: spin 1.1s linear infinite;
      box-shadow: 0 0 40px rgba(120, 150, 255, 0.35);
    }
    #loader p {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: 0.45; } }

    /* ----- Interface ----- */
    .brand {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      left: 26px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px);
      animation: fadeUp 1.2s var(--ease) 2.2s forwards;
    }
    .brand i {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #10a37f, #4c8bf5, #a78bfa, #d97757, #10a37f);
      box-shadow: 0 0 22px rgba(120, 150, 255, 0.55);
      animation: spin 9s linear infinite;
      -webkit-mask: radial-gradient(circle, transparent 8px, #000 9px);
      mask: radial-gradient(circle, transparent 8px, #000 9px);
    }
    .brand b { display: block; font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
    .brand span { display: block; margin-top: 1px; font-size: 12px; color: var(--muted); }

    #reset {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      right: 24px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--glass);
      color: var(--text);
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      animation: fadeUp 1.2s var(--ease) 2.4s forwards;
      transition: transform 0.35s var(--ease), box-shadow 0.35s, border-color 0.35s;
    }
    #reset:hover { transform: scale(1.1) rotate(90deg); border-color: rgba(255, 255, 255, 0.35); box-shadow: 0 0 24px rgba(140, 170, 255, 0.45); }
    #reset svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }

    .hint {
      position: fixed;
      left: 50%;
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + 74px);
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      margin: 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 1.4s ease 3s forwards;
      transition: opacity 1s ease;
    }
    .hint.gone { animation: none; opacity: 0; }

    .dock {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      display: flex;
      gap: 6px;
      max-width: calc(100% - 24px);
      padding: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
      opacity: 0;
      animation: dockIn 1.2s var(--ease) 2.6s forwards;
    }
    .dock::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px 9px 10px;
      border-radius: 15px;
      color: var(--text);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: background 0.3s, transform 0.35s var(--ease), box-shadow 0.35s;
    }
    .chip img { width: 22px; height: 22px; display: block; }
    .chip:hover, .chip:focus-visible {
      outline: none;
      background: color-mix(in srgb, var(--c) 22%, transparent);
      box-shadow: 0 0 22px color-mix(in srgb, var(--c) 45%, transparent);
      transform: translateY(-3px);
    }
    @keyframes dockIn { to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }
    @keyframes fadeIn { to { opacity: 1; } }

    /* ----- Carte et badge au survol ----- */
    #badge {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 5;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 35% 30%, #fff, color-mix(in srgb, var(--c) 35%, #fff) 75%);
      box-shadow: 0 0 18px 5px color-mix(in srgb, var(--c) 80%, transparent), 0 0 56px 16px color-mix(in srgb, var(--c) 40%, transparent);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-100px, -100px, 0) scale(0.4);
      transition: opacity 0.3s var(--ease);
      will-change: transform;
    }
    #badge::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 1.5px solid var(--c);
      opacity: 0;
      animation: ping 1.6s ease-out infinite;
    }
    @keyframes ping { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(1.7); opacity: 0; } }
    #badge svg { width: 21px; height: 21px; fill: none; stroke: #05060a; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    #badge.show { opacity: 1; }
    #badge.show::after { opacity: 1; }

    #card {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 5;
      min-width: 150px;
      padding: 10px 18px 11px;
      border-radius: 16px;
      text-align: center;
      background: var(--glass);
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
      box-shadow: 0 0 34px color-mix(in srgb, var(--c) 30%, transparent), 0 14px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-100px, -100px, 0);
      transition: opacity 0.3s var(--ease);
      will-change: transform;
    }
    #card.show { opacity: 1; }
    #card b { display: block; font-size: 16px; letter-spacing: 0.01em; }
    #card span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
    #card em {
      display: inline-block;
      margin-top: 7px;
      padding: 3px 11px;
      border-radius: 999px;
      font-style: normal;
      font-size: 11.5px;
      font-weight: 600;
      color: #05060a;
      background: color-mix(in srgb, var(--c) 70%, #fff);
    }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 560px) {
      .brand { left: 16px; }
      #reset { right: 14px; }
      .chip { padding: 9px 10px 9px 8px; font-size: 12.5px; gap: 7px; }
      .chip img { width: 19px; height: 19px; }
      .hint { font-size: 11.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner, .brand i, #badge::after { animation-duration: 0s; }
    }
  </style>
</head>

    const AIS = [
      { key: 'chatgpt', name: 'ChatGPT', by: 'OpenAI',        url: 'https://chatgpt.com',       color: '#10a37f', color2: '#7ee8c9' },

    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
    const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    const rnd = (a, b) => a + Math.random() * (b - a);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const MOTION = reduceMotion ? 0.35 : 1;

    function logoUrl(svg) {
      const s = svg
        .replace(/currentColor/g, '#ffffff')
        .replace(/width="1em"/, 'width="512"')
        .replace(/height="1em"/, 'height="512"');
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
    }
    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }
    function rgba(hex, a) {
      const c = new THREE.Color(hex).convertLinearToSRGB();
      return `rgba(${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)},${a})`;
    }

    /* ---------- Dock (liens directs) ---------- */
    const dock = document.getElementById('dock');
    let dockHover = null;
    for (const ai of AIS) {
      const a = document.createElement('a');
      a.className = 'chip';
      a.href = ai.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.setProperty('--c', ai.color);
      const img = document.createElement('img');
      img.alt = '';
      img.src = logoUrl(LOGOS[ai.key]);
      a.append(img, document.createTextNode(ai.name));
      dock.appendChild(a);
      ai.chip = a;
    }

    /* ---------- Préchargement des logos ---------- */
    const images = await Promise.all(AIS.map((ai) => loadImage(logoUrl(LOGOS[ai.key]))));

    /* =====================================================================
       Moteur 3D
       ===================================================================== */
    const canvas = document.getElementById('scene');
    const loader = document.getElementById('loader');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    } catch (err) {
      document.getElementById('loaderText').textContent = 'WebGL indisponible sur cet appareil';
      document.querySelector('.spinner').style.display = 'none';
      throw err;
    }
    const PR = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(PR);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02030a);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 2000);
    const homePos = () => new THREE.Vector3(0, 2.5, camera.aspect < 0.9 ? 31 : 23);
    const introFrom = new THREE.Vector3(0, 22, 95);
    camera.position.copy(introFrom);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.rotateSpeed = 0.7;
    controls.zoomSpeed = 0.8;
    controls.minDistance = 3;
    controls.maxDistance = 90;
    controls.autoRotateSpeed = 0.35;
    controls.enabled = false;
    controls.update();

    /* Post-traitement : bloom + tone mapping, avec anti-crénelage MSAA */
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(PR);
    composer.setSize(window.innerWidth, window.innerHeight);
    composer.renderTarget1.samples = 4;
    composer.renderTarget2.samples = 4;
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.4, 0.6, 0.9);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    /* Environnement pour les reflets du verre */
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envMap = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

    /* Lumières */
    scene.add(new THREE.AmbientLight(0x8fa4ff, 0.35));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(8, 10, 12);
    scene.add(keyLight);
    const coreLight = new THREE.PointLight(0xffd9a8, 260, 70, 2);
    scene.add(coreLight);
    const rimLight = new THREE.PointLight(0x6f8dff, 120, 80, 2);
    rimLight.position.set(-14, -8, -10);
    scene.add(rimLight);

    const U_TIME = { value: 0 };
    const NOISE_GLSL = `
      float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float noise(vec3 x){
        vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.02 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return s; }
    `;

    /* ---------- Nébuleuse de fond ---------- */
    const nebula = new THREE.Mesh(
      new THREE.SphereGeometry(900, 48, 48),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: { uTime: U_TIME },
        vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          uniform float uTime; varying vec3 vDir;
          ${NOISE_GLSL}
          void main(){
            vec3 d = normalize(vDir);
            float n1 = fbm(d * 2.4 + vec3(uTime * 0.006, 0.0, uTime * 0.004));
            float n2 = fbm(d * 4.2 + vec3(7.0, uTime * 0.008, 2.0));
            float n3 = fbm(d * 1.4 - vec3(0.0, uTime * 0.005, 5.0));
            vec3 col = vec3(0.006, 0.008, 0.022);
            col += vec3(0.16, 0.07, 0.34) * smoothstep(0.5, 0.95, n1) * 0.34;
            col += vec3(0.02, 0.17, 0.30) * smoothstep(0.55, 0.98, n2) * 0.3;
            col += vec3(0.30, 0.10, 0.18) * smoothstep(0.6, 1.0, n3) * 0.16;
            gl_FragColor = vec4(col, 1.0);
          }`,
      })
    );
    nebula.renderOrder = -10;
    scene.add(nebula);

    /* ---------- Étoiles scintillantes + poussière proche (parallaxe) ---------- */
    function makeStarField(count, near) {
      const pos = new Float32Array(count * 3), size = new Float32Array(count), phase = new Float32Array(count), col = new Float32Array(count * 3);
      const palette = [[1, 1, 1], [0.7, 0.8, 1], [1, 0.9, 0.75], [0.8, 0.7, 1]];
      for (let i = 0; i < count; i++) {
        const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
        const r = near ? 8 + Math.cbrt(Math.random()) * 60 : rnd(220, 700);
        pos.set([Math.cos(a) * s * r, u * r, Math.sin(a) * s * r], i * 3);
        size[i] = near ? rnd(0.6, 2.0) : (Math.random() < 0.06 ? rnd(2.6, 4.2) : rnd(0.8, 2.0));
        phase[i] = Math.random();
        const c = palette[(Math.random() * palette.length) | 0], k = (Math.random() < 0.05 ? 2.6 : 1) * (near ? 0.8 : 1);
        col.set([c[0] * k, c[1] * k, c[2] * k], i * 3);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
      g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
      g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
      const m = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: U_TIME, uPR: { value: PR }, uNear: { value: near ? 1 : 0 } },
        vertexShader: `
          attribute float aSize; attribute float aPhase; attribute vec3 aColor;
          uniform float uTime, uPR, uNear; varying vec3 vC; varying float vA;
          void main(){
            vec3 p = position;
            if (uNear > 0.5) p += vec3(sin(uTime * 0.15 + aPhase * 6.0), cos(uTime * 0.12 + aPhase * 9.0), sin(uTime * 0.1 + aPhase * 3.0)) * 1.8;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_Position = projectionMatrix * mv;
            float tw = 0.62 + 0.38 * sin(uTime * (0.8 + aPhase * 2.2) + aPhase * 40.0);
            float s = aSize * uPR;
            if (uNear > 0.5) s = aSize * uPR * 55.0 / max(-mv.z, 1.0);
            gl_PointSize = clamp(s, 0.0, 40.0);
            vC = aColor; vA = tw * (uNear > 0.5 ? 0.55 : 1.0);
          }`,
        fragmentShader: `
          varying vec3 vC; varying float vA;
          void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); a *= a; gl_FragColor = vec4(vC, a * vA); }`,
      });
      const pts = new THREE.Points(g, m);
      pts.frustumCulled = false;
      return pts;
    }
    scene.add(makeStarField(4200, false));
    scene.add(makeStarField(1100, true));

    /* ---------- Galaxie en rotation différentielle ---------- */
    const galaxy = (() => {
      const N = 11000;
      const aR = new Float32Array(N), aA = new Float32Array(N), aY = new Float32Array(N), aB = new Float32Array(N), aS = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const r = 1.6 + Math.pow(Math.random(), 1.5) * 19;
        const arm = i % 3;
        aR[i] = r;
        aA[i] = arm * (Math.PI * 2 / 3) + r * 0.4 + (Math.random() - 0.5) * (0.5 + r * 0.045);
        aY[i] = (Math.random() + Math.random() + Math.random() - 1.5) * (0.35 + r * 0.045);
        aB[i] = 0.35 + Math.random() * 0.9 * (1.2 - r / 26);
        aS[i] = rnd(0.6, 1.7);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
      g.setAttribute('aR', new THREE.BufferAttribute(aR, 1));
      g.setAttribute('aA', new THREE.BufferAttribute(aA, 1));
      g.setAttribute('aY', new THREE.BufferAttribute(aY, 1));
      g.setAttribute('aB', new THREE.BufferAttribute(aB, 1));
      g.setAttribute('aS', new THREE.BufferAttribute(aS, 1));
      const m = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: U_TIME, uPR: { value: PR } },
        vertexShader: `
          attribute float aR; attribute float aA; attribute float aY; attribute float aB; attribute float aS;
          uniform float uTime, uPR; varying vec3 vC;
          void main(){
            float ang = aA + uTime * 0.3 / (0.5 + aR * 0.17);
            vec3 p = vec3(cos(ang) * aR, aY, sin(ang) * aR);
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = clamp(aS * uPR * 30.0 / max(-mv.z, 1.0), 1.0, 14.0);
            float t = clamp((aR - 1.6) / 17.0, 0.0, 1.0);
            vC = mix(vec3(1.0, 0.7, 0.42), vec3(0.34, 0.5, 1.0), t) * aB;
          }`,
        fragmentShader: `
          varying vec3 vC;
          void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); gl_FragColor = vec4(vC, a * a * 0.62); }`,
      });
      const pts = new THREE.Points(g, m);
      pts.frustumCulled = false;
      pts.rotation.set(0.32, 0, -0.1);
      return pts;
    })();
    scene.add(galaxy);

    /* ---------- Textures utilitaires ---------- */
    function makeGlowTexture(color, inner = 1, mid = 0.38) {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      g.addColorStop(0, rgba(color, inner));
      g.addColorStop(0.3, rgba(color, mid));
      g.addColorStop(0.65, rgba(color, mid * 0.18));
      g.addColorStop(1, rgba(color, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const dotTexture = makeGlowTexture('#ffffff', 1, 0.5);

    function makeLogoTexture(ai, img) {
      const S = 512;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const ctx = c.getContext('2d');
      // Médaillon sombre pour garantir le contraste de chaque logo
      const g = ctx.createRadialGradient(S / 2, S * 0.4, S * 0.05, S / 2, S / 2, S * 0.48);
      g.addColorStop(0, 'rgba(18,22,38,0.82)');
      g.addColorStop(1, 'rgba(4,6,14,0.94)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(S / 2, S / 2, S * 0.47, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 7;
      const ring = ctx.createLinearGradient(0, 0, S, S);
      ring.addColorStop(0, rgba(ai.color2, 0.95));
      ring.addColorStop(1, rgba(ai.color, 0.55));
      ctx.strokeStyle = ring;
      ctx.beginPath();
      ctx.arc(S / 2, S / 2, S * 0.455, 0, Math.PI * 2);
      ctx.stroke();
      const size = S * 0.5;
      if (img) {
        ctx.shadowColor = rgba(ai.color, 0.9);
        ctx.shadowBlur = 24;
        ctx.drawImage(img, (S - size) / 2, (S - size) / 2, size, size);
      } else {
        ctx.fillStyle = '#fff';
        ctx.font = '700 120px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ai.name, S / 2, S / 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    /* ---------- Cœur de l'univers ---------- */
    const centerGroup = new THREE.Group();
    scene.add(centerGroup);
    const sunCore = new THREE.Mesh(
      new THREE.SphereGeometry(0.42, 32, 32),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 2.5, 1.7) })
    );
    centerGroup.add(sunCore);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeGlowTexture('#ffc88a', 1, 0.5), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85,
    }));
    sunGlow.scale.setScalar(9);
    centerGroup.add(sunGlow);
    const gyros = [];
    [1.15, 1.6, 2.1].forEach((r, k) => {
      const holder = new THREE.Group();
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.01, 8, 160),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(1.1, 1.3, 2.0), transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      holder.add(ring);
      holder.rotation.set(k * 1.0, k * 0.6, 0);
      centerGroup.add(holder);
      gyros.push({ holder, speed: (k % 2 ? -1 : 1) * (0.25 + k * 0.12) });
    });

    /* =====================================================================
       Sphères IA
       ===================================================================== */
    const RADIUS = 1.25;
    const coreGeo = new THREE.SphereGeometry(RADIUS, 96, 96);
    const shellGeo = new THREE.SphereGeometry(RADIUS * 1.1, 64, 64);
    const auraGeo = new THREE.SphereGeometry(RADIUS * 1.1, 48, 48);
    const ringGeos = [0, 1].map((k) => new THREE.TorusGeometry(RADIUS * (1.62 + k * 0.4), 0.012, 8, 180));
    const dotGeo = new THREE.SphereGeometry(0.06, 12, 12);
    const GOLDEN = Math.PI * (3 - Math.sqrt(5));

    const root = new THREE.Group();
    scene.add(root);

    const items = AIS.map((ai, i) => {
      const y = 1 - (i / (AIS.length - 1)) * 2;
      const ringR = Math.sqrt(1 - y * y);
      const theta = GOLDEN * i;
      const dist = 6 + (i % 3) * 1.5;
      const base = new THREE.Vector3(Math.cos(theta) * ringR, y * 0.85, Math.sin(theta) * ringR).multiplyScalar(dist);
      const c1 = new THREE.Color(ai.color), c2 = new THREE.Color(ai.color2);

      const pivot = new THREE.Group();
      pivot.position.copy(base);
      pivot.scale.setScalar(0.0001);

      // Noyau énergétique (shader : fresnel + nébuleuse interne)
      const coreMat = new THREE.ShaderMaterial({
        uniforms: { uColor: { value: c1 }, uColor2: { value: c2 }, uTime: U_TIME, uHover: { value: 0 }, uSeed: { value: i * 7.13 } },
        vertexShader: `
          varying vec3 vN; varying vec3 vV; varying vec3 vObj;
          void main(){ vObj = position; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `
          uniform vec3 uColor; uniform vec3 uColor2; uniform float uTime; uniform float uHover; uniform float uSeed;
          varying vec3 vN; varying vec3 vV; varying vec3 vObj;
          ${NOISE_GLSL}
          void main(){
            vec3 n = normalize(vN); vec3 v = normalize(vV);
            float fres = pow(1.0 - max(dot(n, v), 0.0), 2.3);
            float flow = fbm(vObj * 1.7 + vec3(uSeed, uTime * 0.18, uTime * 0.11));
            float flow2 = fbm(vObj * 3.1 - vec3(uTime * 0.12, uSeed, uTime * 0.2));
            vec3 base = mix(vec3(0.012, 0.016, 0.034), uColor * 0.34, smoothstep(0.25, 0.85, flow));
            base += mix(uColor, uColor2, flow2) * smoothstep(0.55, 0.9, flow2) * 0.38;
            vec3 rim = mix(uColor, uColor2, clamp(n.y * 0.5 + 0.5, 0.0, 1.0)) * fres * (0.75 + uHover * 1.4);
            vec3 col = base * (0.85 + uHover * 0.9) + rim;
            gl_FragColor = vec4(col, 1.0);
          }`,
      });
      const core = new THREE.Mesh(coreGeo, coreMat);

      // Coque de verre réfléchissant
      const shell = new THREE.Mesh(shellGeo, new THREE.MeshPhysicalMaterial({
        color: 0xffffff, metalness: 0, roughness: 0.03, transparent: true, opacity: 0.1,
        clearcoat: 1, clearcoatRoughness: 0.02, envMap, envMapIntensity: 1.0, depthWrite: false,
      }));

      // Halo de bordure
      const aura = new THREE.Mesh(auraGeo, new THREE.MeshBasicMaterial({
        color: c1, transparent: true, opacity: 0.1, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      aura.scale.setScalar(1.22);

      // Lueur ambiante, amplifiée au survol
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeGlowTexture(ai.color), transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      halo.scale.setScalar(6.2);

      // Logo officiel : toujours face à la caméra, net sous tous les angles
      const logo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeLogoTexture(ai, images[i]), transparent: true, depthWrite: false,
      }));
      logo.scale.setScalar(RADIUS * 1.5);

      halo.renderOrder = 1; shell.renderOrder = 2; aura.renderOrder = 1; logo.renderOrder = 4;
      pivot.add(core, shell, aura, halo, logo);

      // Anneaux orbitaux + satellites
      const rings = ringGeos.map((geo, k) => {
        const tilt = new THREE.Group();
        tilt.rotation.set(0.5 + k * 0.85 + Math.random() * 0.5, Math.random() * Math.PI, 0);
        const spin = new THREE.Group();
        const mat = new THREE.MeshBasicMaterial({ color: c1, transparent: true, opacity: 0.26, blending: THREE.AdditiveBlending, depthWrite: false });
        const torus = new THREE.Mesh(geo, mat);
        const dot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: c2.clone().multiplyScalar(4) }));
        dot.position.x = RADIUS * (1.62 + k * 0.4);
        spin.add(torus, dot);
        tilt.add(spin);
        pivot.add(tilt);
        return { spin, mat, speed: (k ? -1 : 1) * rnd(0.5, 1.0) };
      });

      root.add(pivot);
      return {
        ...ai, i, pivot, core, shell, halo, logo, rings, base,
        vel: new THREE.Vector3(), hover: 0, appear: 0,
        ph: i * 1.7, f: 0.25 + (i % 4) * 0.07, c1, c2,
      };
    });

    /* ---------- Liaisons lumineuses entre les sphères ---------- */
    const PAIRS = [];
    for (let a = 0; a < items.length; a++) for (let b = a + 1; b < items.length; b++) PAIRS.push([items[a], items[b]]);
    const linePos = new Float32Array(PAIRS.length * 6);
    const lineCol = new Float32Array(PAIRS.length * 6);
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
    lineGeo.setAttribute('color', new THREE.BufferAttribute(lineCol, 3));
    const links = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    links.frustumCulled = false;
    root.add(links);

    /* ---------- Étincelles (particules d'interaction) ---------- */
    const MAXS = 800;
    const spPos = new Float32Array(MAXS * 3), spCol = new Float32Array(MAXS * 3), spBase = new Float32Array(MAXS * 3);
    const spVel = new Float32Array(MAXS * 3), spLife = new Float32Array(MAXS), spMax = new Float32Array(MAXS);
    let spNext = 0;
    const spGeo = new THREE.BufferGeometry();
    spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
    spGeo.setAttribute('color', new THREE.BufferAttribute(spCol, 3));
    const sparks = new THREE.Points(spGeo, new THREE.PointsMaterial({
      size: 0.32, map: dotTexture, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    sparks.frustumCulled = false;
    scene.add(sparks);

    function burst(pos, color, n, speed) {
      for (let k = 0; k < n; k++) {
        const i = spNext;
        spNext = (spNext + 1) % MAXS;
        const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
        const sp = speed * rnd(0.35, 1);
        spPos.set([pos.x, pos.y, pos.z], i * 3);
        spVel.set([Math.cos(a) * s * sp, u * sp, Math.sin(a) * s * sp], i * 3);
        spBase.set([color.r * 2.6, color.g * 2.6, color.b * 2.6], i * 3);
        spLife[i] = 1;
        spMax[i] = rnd(0.7, 1.7);
      }
    }
    function updateSparks(dt) {
      const drag = Math.exp(-dt * 1.5);
      for (let i = 0; i < MAXS; i++) {
        if (spLife[i] > 0) {
          spLife[i] -= dt / spMax[i];
          const f = Math.max(0, spLife[i]);
          const k = f * f;
          for (let j = 0; j < 3; j++) {
            spVel[i * 3 + j] *= drag;
            spPos[i * 3 + j] += spVel[i * 3 + j] * dt;
            spCol[i * 3 + j] = spBase[i * 3 + j] * k;
          }
        } else {
          spCol[i * 3] = spCol[i * 3 + 1] = spCol[i * 3 + 2] = 0;
        }
      }
      spGeo.attributes.position.needsUpdate = true;
      spGeo.attributes.color.needsUpdate = true;
    }

    /* ---------- Étoiles filantes ---------- */
    const shooters = Array.from({ length: 3 }, () => {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
      g.setAttribute('color', new THREE.BufferAttribute(new Float32Array([3.4, 3.6, 4.4, 0, 0, 0]), 3));
      const line = new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
      line.frustumCulled = false;
      line.visible = false;
      scene.add(line);
      return { line, head: new THREE.Vector3(), dir: new THREE.Vector3(), life: 0, wait: rnd(1, 4) };
    });
    function updateShooters(dt) {
      for (const s of shooters) {
        if (s.life > 0) {
          s.life -= dt;
          s.head.addScaledVector(s.dir, 70 * dt);
          const p = s.line.geometry.attributes.position;
          p.setXYZ(0, s.head.x, s.head.y, s.head.z);
          p.setXYZ(1, s.head.x - s.dir.x * 9, s.head.y - s.dir.y * 9, s.head.z - s.dir.z * 9);
          p.needsUpdate = true;
          s.line.material.opacity = clamp01(s.life * 2.5);
          if (s.life <= 0) s.line.visible = false;
        } else if ((s.wait -= dt) <= 0) {
          const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = rnd(45, 90), sq = Math.sqrt(1 - u * u);
          s.head.set(Math.cos(a) * sq * r, u * r * 0.6, Math.sin(a) * sq * r);
          s.dir.set(rnd(-1, 1), rnd(-0.6, 0.2), rnd(-1, 1)).normalize();
          s.life = 1.3;
          s.wait = rnd(1.5, 5);
          s.line.visible = true;
        }
      }
    }

    /* =====================================================================
       Interactions
       ===================================================================== */
    const badge = document.getElementById('badge');
    const card = document.getElementById('card');
    const hint = document.getElementById('hint');
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const hitMeshes = items.map((it) => it.shell);
    const itemByMesh = new Map(items.map((it) => [it.shell, it]));
    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();

    let pointer = null;
    let hovered = null;
    let prevHovered = null;
    let introDone = false;

    function pick(x, y) {
      ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      const hit = raycaster.intersectObjects(hitMeshes, false)[0];
      return hit ? itemByMesh.get(hit.object) : null;
    }

    /* Rotation automatique douce, suspendue pendant les interactions */
    let autoTimer = 0;
    function pauseAuto(ms = 4500) {
      controls.autoRotate = false;
      clearTimeout(autoTimer);
      autoTimer = setTimeout(() => { if (introDone && !grabbed) controls.autoRotate = !reduceMotion; }, ms);
    }
    controls.addEventListener('start', () => { cancelTween(); pauseAuto(60000); });
    controls.addEventListener('end', () => pauseAuto(4500));

    /* Vol de caméra fluide (recentrage) */
    let tween = null;
    function flyTo(pos, target, dur = 1.6) {
      tween = { t: 0, dur, p0: camera.position.clone(), p1: pos.clone(), t0: controls.target.clone(), t1: target.clone() };
    }
    function cancelTween() { tween = null; }
    function resetView() { pauseAuto(5000); flyTo(homePos(), new THREE.Vector3(0, 0, 0), 1.8); }
    document.getElementById('reset').addEventListener('click', resetView);

    /* Déplacer une sphère : maintenir appuyé puis glisser (avec inertie au lâcher) */
    const LONG_PRESS_MS = 320;
    const MOVE_TOLERANCE = 8;
    let pressStart = null, pressTimer = 0, grabbed = null, skipClick = false;
    const grabPlane = new THREE.Plane();
    const grabOffset = new THREE.Vector3();
    const grabWorld = new THREE.Vector3();
    const grabCur = new THREE.Vector3();
    const grabVel = new THREE.Vector3();
    const hitPoint = new THREE.Vector3();
    const camDir = new THREE.Vector3();

    function rayToGrabPlane(x, y, out) {
      ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      return raycaster.ray.intersectPlane(grabPlane, out);
    }
    function startGrab(it, x, y) {
      it.pivot.getWorldPosition(tmp);
      camera.getWorldDirection(camDir);
      grabPlane.setFromNormalAndCoplanarPoint(camDir, tmp);
      if (rayToGrabPlane(x, y, hitPoint)) grabOffset.copy(tmp).sub(hitPoint);
      else grabOffset.set(0, 0, 0);
      grabWorld.copy(tmp);
      grabCur.copy(tmp);
      grabVel.set(0, 0, 0);
      it.vel.set(0, 0, 0);
      grabbed = it;
      controls.enabled = false;
      controls.autoRotate = false;
      skipClick = true;
      burst(tmp, it.c2, 46, 5.5);
    }
    function cancelPress() { clearTimeout(pressTimer); pressTimer = 0; }

    canvas.addEventListener('pointerdown', (e) => {
      skipClick = false;
      hint.classList.add('gone');
      if (e.button !== 0 || !introDone) return;
      pressStart = { x: e.clientX, y: e.clientY };
      const it = pick(e.clientX, e.clientY);
      if (!it) return;
      cancelPress();
      pressTimer = setTimeout(() => startGrab(it, pressStart.x, pressStart.y), LONG_PRESS_MS);
    });
    window.addEventListener('pointermove', (e) => {
      pointer = { x: e.clientX, y: e.clientY };
      if (grabbed) {
        if (rayToGrabPlane(e.clientX, e.clientY, hitPoint)) grabWorld.copy(hitPoint).add(grabOffset);
        return;
      }
      if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > MOVE_TOLERANCE) cancelPress();
    });
    function endPointer(e) {
      const moved = pressStart ? Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) : 0;
      cancelPress();
      if (grabbed) {
        // Lancer : la sphère conserve l'élan et ralentit en douceur
        tmp.copy(grabVel).applyQuaternion(invQuat.copy(root.quaternion).invert()).clampLength(0, 34);
        grabbed.vel.copy(tmp);
        grabbed.pivot.getWorldPosition(tmp2);
        burst(tmp2, grabbed.c1, 22, 3.5);
        grabbed = null;
        controls.enabled = true;
        skipClick = true;
        pauseAuto(5000);
      } else if (moved > MOVE_TOLERANCE) {
        skipClick = true;
      }
      pressStart = null;
      if (e.pointerType === 'touch') pointer = null;
    }
    window.addEventListener('pointerup', endPointer);
    window.addEventListener('pointercancel', endPointer);
    window.addEventListener('mouseout', (e) => { if (!e.relatedTarget) pointer = null; });

    /* Redirection directe vers le site de l'IA */
    function openSite(it) {
      it.pivot.getWorldPosition(tmp);
      burst(tmp, it.c2, 90, 8);
      const a = document.createElement('a');
      a.href = it.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    canvas.addEventListener('click', (e) => {
      if (skipClick || !introDone) return;
      const it = pick(e.clientX, e.clientY);
      if (it) openSite(it);
    });

    for (const it of items) {
      it.chip.addEventListener('pointerenter', () => { dockHover = it; });
      it.chip.addEventListener('pointerleave', () => { if (dockHover === it) dockHover = null; });
      it.chip.addEventListener('focus', () => { dockHover = it; });
      it.chip.addEventListener('blur', () => { if (dockHover === it) dockHover = null; });
    }

    /* Clavier : voler dans l'espace */
    const keys = new Set();
    const UP = new THREE.Vector3(0, 1, 0);
    const fwd = new THREE.Vector3(), side = new THREE.Vector3(), step = new THREE.Vector3();
    window.addEventListener('keydown', (e) => {
      if (e.target instanceof HTMLElement && e.target.closest('a, button')) { if (e.code === 'Space') return; }
      keys.add(e.code);
      hint.classList.add('gone');
      if (e.code === 'KeyR') resetView();
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));
    window.addEventListener('blur', () => keys.clear());

    function flyCamera(dt) {
      let f = 0, s = 0, v = 0;
      if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) s += 1;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) s -= 1;
      if (keys.has('Space') || keys.has('KeyE')) v += 1;
      if (keys.has('KeyQ')) v -= 1;
      if (!introDone || (f === 0 && s === 0 && v === 0)) return;
      cancelTween();
      pauseAuto(5000);
      camera.getWorldDirection(fwd);
      side.crossVectors(fwd, UP).normalize();
      step.set(0, 0, 0).addScaledVector(fwd, f).addScaledVector(side, s).addScaledVector(UP, v);
      if (step.lengthSq() === 0) return;
      step.normalize().multiplyScalar((keys.has('ShiftLeft') || keys.has('ShiftRight') ? 26 : 12) * dt);
      camera.position.add(step);
      controls.target.add(step);
    }

    /* Carte + badge lumineux : suivent la sphère de façon fluide */
    let shownItem = null;
    const smooth = { cx: 0, cy: 0, bx: 0, by: 0, ready: false };
    function updateOverlay(it, dt) {
      if (it) {
        it.pivot.getWorldPosition(tmp);
        const dist = camera.position.distanceTo(tmp);
        const radiusPx = (RADIUS * it.pivot.scale.x) / (dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * (window.innerHeight / 2);
        tmp.project(camera);
        const behind = tmp.z > 1;
        const sx = (tmp.x * 0.5 + 0.5) * window.innerWidth;
        const sy = (-tmp.y * 0.5 + 0.5) * window.innerHeight;
        const halfW = Math.min(100, window.innerWidth / 2 - 8);
        const cx = Math.min(window.innerWidth - halfW, Math.max(halfW, sx));
        const cy = Math.min(window.innerHeight - 130, sy + radiusPx * 1.1 + 16);
        const bx = sx + radiusPx * 0.72, by = sy - radiusPx * 0.72;
        if (shownItem !== it || !smooth.ready) {
          smooth.cx = cx; smooth.cy = cy; smooth.bx = bx; smooth.by = by; smooth.ready = true;
          if (shownItem !== it) {
            card.firstElementChild.textContent = it.name;
            card.children[1].textContent = it.by;
            card.style.setProperty('--c', it.color);
            badge.style.setProperty('--c', it.color);
            shownItem = it;
          }
        }
        const k = 1 - Math.exp(-dt * 18);
        smooth.cx += (cx - smooth.cx) * k; smooth.cy += (cy - smooth.cy) * k;
        smooth.bx += (bx - smooth.bx) * k; smooth.by += (by - smooth.by) * k;
        card.style.transform = `translate3d(${smooth.cx}px, ${smooth.cy}px, 0) translateX(-50%)`;
        badge.style.transform = `translate3d(${smooth.bx}px, ${smooth.by}px, 0) translate(-50%, -50%) scale(1)`;
        const vis = !behind;
        card.classList.toggle('show', vis);
        badge.classList.toggle('show', vis);
      } else {
        card.classList.remove('show');
        badge.classList.remove('show');
        badge.style.transform = badge.style.transform.replace(/scale\([^)]*\)/, 'scale(0.4)');
        smooth.ready = false;
        shownItem = null;
      }
    }

    /* =====================================================================
       Boucle d'animation
       ===================================================================== */
    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloom.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);

    const INTRO_FLY = 3.6;
    let introT = 0, started = false, last = performance.now(), t = 0;
    const worldBase = new THREE.Vector3();
    const invQuat = new THREE.Quaternion();

    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.max(0, Math.min((now - last) / 1000, 0.05));
      last = now;
      t += dt;
      U_TIME.value = t;

      /* Entrée en scène : vol de caméra + apparition élastique des sphères */
      if (started) {
        introT += dt;
        if (!introDone) {
          camera.position.lerpVectors(introFrom, homePos(), easeInOutCubic(clamp01(introT / INTRO_FLY)));
          if (introT >= INTRO_FLY) {
            introDone = true;
            controls.enabled = true;
            controls.autoRotate = !reduceMotion;
          }
        }
      }
      if (tween) {
        tween.t += dt;
        const k = easeInOutCubic(clamp01(tween.t / tween.dur));
        camera.position.lerpVectors(tween.p0, tween.p1, k);
        controls.target.lerpVectors(tween.t0, tween.t1, k);
        if (tween.t >= tween.dur) tween = null;
      }
      flyCamera(dt);
      controls.update();

      root.rotation.y += dt * 0.03 * MOTION;
      scene.updateMatrixWorld();

      /* La sphère saisie suit le pointeur avec un lissage fluide */
      if (grabbed) {
        const before = tmp.copy(grabCur);
        grabCur.lerp(grabWorld, 1 - Math.exp(-dt * 16));
        if (dt > 0) grabVel.lerp(tmp2.copy(grabCur).sub(before).divideScalar(dt), 0.35);
        grabbed.base.copy(root.worldToLocal(tmp.copy(grabCur)));
        if (grabVel.lengthSq() > 4) burst(grabCur, grabbed.c2, 2, 0.9);
      }

      /* Inertie, limites de l'espace et collisions douces entre sphères */
      for (const it of items) {
        if (it === grabbed) continue;
        it.base.addScaledVector(it.vel, dt);
        it.vel.multiplyScalar(Math.exp(-dt * 1.7));
        const len = it.base.length();
        if (len > 26) it.vel.addScaledVector(it.base, (-(len - 26) / len) * dt * 6);
      }
      const minD = RADIUS * 2.9;
      for (const [a, b] of PAIRS) {
        tmp.copy(b.base).sub(a.base);
        const d = tmp.length();
        if (d < minD && d > 1e-4) {
          const push = (minD - d) * Math.min(1, dt * 9);
          tmp.divideScalar(d);
          const wa = a === grabbed ? 0 : b === grabbed ? 1 : 0.5;
          const wb = b === grabbed ? 0 : a === grabbed ? 1 : 0.5;
          a.base.addScaledVector(tmp, -push * wa);
          b.base.addScaledVector(tmp, push * wb);
          a.vel.addScaledVector(tmp, -push * wa * 2);
          b.vel.addScaledVector(tmp, push * wb * 2);
        }
      }
      for (const it of items) {
        it.pivot.position.set(
          it.base.x + Math.sin(t * it.f + it.ph) * 0.45,
          it.base.y + Math.cos(t * it.f * 0.8 + it.ph * 1.3) * 0.45,
          it.base.z + Math.sin(t * it.f * 0.6 + it.ph * 0.7) * 0.6
        );
      }

      scene.updateMatrixWorld();
      hovered = grabbed || (pointer && introDone ? pick(pointer.x, pointer.y) : null) || dockHover;
      if (hovered && hovered !== prevHovered && hovered !== grabbed) {
        hovered.pivot.getWorldPosition(tmp);
        burst(tmp, hovered.c2, 26, 4.2);
      }
      prevHovered = hovered;

      /* Animation des sphères */
      for (const it of items) {
        const active = it === hovered ? 1 : 0;
        it.hover += (active - it.hover) * Math.min(1, dt * 7);
        const ap = easeOutBack(clamp01((introT - 0.5 - it.i * 0.16) / 1.1));
        it.appear = started ? ap : 0;
        const grabBoost = it === grabbed ? 0.08 : 0;
        it.pivot.scale.setScalar(Math.max(0.0001, it.appear * (1 + it.hover * 0.16 + grabBoost)));

        it.core.rotation.y += dt * (0.2 + it.hover * 0.7);
        const u = it.core.material.uniforms;
        u.uHover.value = it.hover;
        it.shell.material.opacity = 0.1 + it.hover * 0.08;
        it.halo.material.opacity = 0.08 + it.hover * 0.5 + Math.sin(t * 1.4 + it.ph) * 0.02;
        it.halo.scale.setScalar(6.2 + it.hover * 2.2);
        for (const r of it.rings) {
          r.spin.rotation.z += dt * r.speed * (1 + it.hover * 2.4);
          r.mat.opacity = 0.2 + it.hover * 0.55;
        }
        // Logo orienté vers la caméra, posé sur la face avant du noyau
        tmp.copy(camera.position);
        it.pivot.worldToLocal(tmp);
        it.logo.position.copy(tmp.normalize().multiplyScalar(RADIUS * 1.04));
        it.logo.scale.setScalar(RADIUS * (1.5 + it.hover * 0.1));
      }

      /* Liaisons lumineuses (plus intenses autour de la sphère active) */
      for (let p = 0; p < PAIRS.length; p++) {
        const [a, b] = PAIRS[p];
        const d = a.pivot.position.distanceTo(b.pivot.position);
        const k = Math.pow(clamp01(1 - d / 11), 1.6) * 0.5 * Math.min(a.appear, b.appear);
        const boost = 1 + (a === hovered || b === hovered ? 2.4 : 0) * clamp01(Math.max(a.hover, b.hover));
        const o = p * 6;
        linePos.set([a.pivot.position.x, a.pivot.position.y, a.pivot.position.z, b.pivot.position.x, b.pivot.position.y, b.pivot.position.z], o);
        lineCol.set([a.c1.r * k * boost, a.c1.g * k * boost, a.c1.b * k * boost, b.c1.r * k * boost, b.c1.g * k * boost, b.c1.b * k * boost], o);
      }
      lineGeo.attributes.position.needsUpdate = true;
      lineGeo.attributes.color.needsUpdate = true;

      /* Cœur, galaxie, particules */
      const pulse = 1 + Math.sin(t * 2.1) * 0.08;
      sunCore.scale.setScalar(pulse * Math.min(1, introT * 0.8));
      sunGlow.material.opacity = (0.7 + Math.sin(t * 1.7) * 0.1) * Math.min(1, introT * 0.5);
      for (const g of gyros) { g.holder.rotation.y += dt * g.speed; g.holder.rotation.x += dt * g.speed * 0.5; }
      galaxy.rotation.y += dt * 0.004 * MOTION;
      updateSparks(dt);
      updateShooters(dt);

      canvas.style.cursor = grabbed ? 'grabbing' : hovered && hovered !== dockHover ? 'pointer' : 'default';
      updateOverlay(hovered, dt);

      composer.render();
    }

    /* Démarrage : première image rendue, puis ouverture du rideau */
    onResize();
    requestAnimationFrame(frame);
    setTimeout(() => {
      loader.classList.add('hide');
      started = true;
    }, 450);
  </script>
</body>
</html>
